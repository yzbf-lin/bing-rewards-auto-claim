name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Validate extension
        run: npm run validate

      - name: Build release archive
        run: npm run package

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: bing-rewards-auto-claim
          path: dist/*.zip
